name: MarketScope CI & Claude Code Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linters & Static Analysis
      run: |
        ruff check src/ tests/
        mypy src/ --ignore-missing-imports

    - name: Run Unit Tests & AC Verification
      run: |
        pytest tests/ -v --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing

    - name: Run Architecture Constraint Tests (NFR-08)
      run: |
        pytest tests/architecture/ -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Node & Playwright Dependencies
      run: |
        npm install
        npm --prefix frontend install
        npm --prefix frontend run build
        npx playwright install --with-deps chromium

    - name: Run Playwright E2E UI Tests
      run: |
        npx playwright test

    - name: Claude Code Automated PR Evaluator
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        python scripts/run_agent_cycle.py sprint-1

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
