[pytest]
markers =
    ac(name): Acceptance Criteria verification tag
    nfr(name): Non-Functional Requirement verification tag
    e2e: End-to-end browser test
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
